name: Render video
on: workflow_dispatch
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unzip project
        run: unzip -q cafe-riverview-promo.zip
      - name: Install system libs
        run: sudo apt-get update && sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 ffmpeg
      - name: Install and render
        working-directory: cafe-riverview-promo
        run: |
          npm install
          npx remotion render src/index.ts Main out/video.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: cafe-riverview-promo/out/video.mp4
